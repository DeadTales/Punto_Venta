[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = [".venv-codex"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Flet se verifica con importorskip antes de importar las vistas que lo necesitan.
"tests/test_frontend.py" = ["E402"]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
